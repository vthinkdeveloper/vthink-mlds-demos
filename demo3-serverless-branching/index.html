<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branch Explorer: MLDS 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D1B2A; --surface: #162032; --border: #1e2d40;
      --teal: #00C9A7; --teal-dim: rgba(0,201,167,0.12);
      --red: #FF5C5C; --red-dim: rgba(255,92,92,0.10);
      --text: #e2e8f0; --muted: #94a3b8;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    @keyframes pulseGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,201,167,0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(0,201,167,0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
    @keyframes dashFlow { to { stroke-dashoffset: -12; } }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.7rem 1.5rem; border-bottom: 1px solid var(--border);
      flex-shrink: 0; background: #0a1520;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .badge {
      font-size: 0.63rem; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--teal);
      background: var(--teal-dim); padding: 0.22rem 0.55rem; border-radius: 4px;
    }
    .title { font-size: 1rem; font-weight: 700; }
    .title span { color: var(--teal); }
    .subtitle { font-size: 0.7rem; color: var(--muted); }
    .back-link {
      font-size: 0.75rem; color: var(--muted); text-decoration: none;
      border: 1px solid var(--border); padding: 0.28rem 0.65rem; border-radius: 5px;
      transition: color 0.15s, border-color 0.15s;
    }
    .back-link:hover { color: var(--teal); border-color: var(--teal); }

    .main { display: flex; flex: 1; overflow: hidden; }

    .chat-panel {
      width: 40%; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .panel-header {
      padding: 0.55rem 1rem; border-bottom: 1px solid var(--border);
      font-size: 0.67rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 0.9rem;
      display: flex; flex-direction: column; gap: 0.7rem;
    }
    .agent-msg {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.7rem 0.9rem;
      font-size: 0.8rem; line-height: 1.65; color: #cbd5e1;
      white-space: pre-wrap; word-break: break-word;
    }
    .user-msg {
      background: rgba(0,201,167,0.09); border: 1px solid rgba(0,201,167,0.2);
      border-radius: 8px; padding: 0.55rem 0.8rem;
      font-size: 0.8rem; color: var(--teal);
      align-self: flex-end; max-width: 92%;
    }
    .input-area {
      padding: 0.65rem; border-top: 1px solid var(--border);
      display: flex; gap: 0.5rem; flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 0.5rem 0.75rem;
      border-radius: 7px; font-size: 0.8rem; resize: none;
      font-family: inherit; outline: none; line-height: 1.4;
    }
    .input-area textarea:focus { border-color: var(--teal); }
    .run-btn {
      padding: 0.5rem 0.95rem; background: var(--teal); color: #0D1B2A;
      border: none; border-radius: 7px; font-weight: 700;
      font-size: 0.78rem; cursor: pointer; transition: opacity 0.15s;
      align-self: flex-end; white-space: nowrap;
    }
    .run-btn:hover { opacity: 0.88; }
    .run-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .tree-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .tree-canvas { flex: 1; position: relative; overflow-y: auto; padding: 1.2rem 1rem; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ─── System prompt ─────────────────────────────────────────────────────── */
const SYSTEM_PROMPT = `You are an AI database migration agent. You solve migration tasks by spawning parallel database branches: one per approach: evaluating each, and merging the winner back to production.

You MUST emit branch control events inline with your reasoning using EXACTLY this format:
[BRANCH:{"name":"approach-1","action":"create","description":"Concise 6-8 word description"}]

MANDATORY SEQUENCE: follow every step in order, do not skip any:

1. One sentence acknowledging the migration task.

2. Write: "Spawning 3 parallel branches to explore approaches:"

3. Introduce approach-1 in one short sentence, then on a new line emit:
[BRANCH:{"name":"approach-1","action":"create","description":"6-8 word description"}]

4. Introduce approach-2 in one short sentence, then emit:
[BRANCH:{"name":"approach-2","action":"create","description":"6-8 word description"}]

5. Introduce approach-3 in one short sentence, then emit:
[BRANCH:{"name":"approach-3","action":"create","description":"6-8 word description"}]

6. Write "Evaluating approach-1...": describe why it fails (lock contention, type mismatch, timeout, constraint violation), then emit:
[BRANCH:{"name":"approach-1","action":"fail","reason":"Specific 8-12 word failure reason"}]

7. Write "Evaluating approach-2...": describe a DIFFERENT failure, then emit:
[BRANCH:{"name":"approach-2","action":"fail","reason":"Specific 8-12 word failure reason"}]

8. Write "Evaluating approach-3...": confirm it succeeds, explain briefly, then emit:
[BRANCH:{"name":"approach-3","action":"merge"}]

9. Write 2 sentences starting with "✓ Migration complete:" summarizing the winning strategy.

Keep total response under 380 words. Make failures realistic and specific to database engineering.`;

/* ─── Extract balanced [BRANCH:{...}] markers ───────────────────────────── */
function extractBranchMarkers(text, fromIndex) {
  if (fromIndex === undefined) fromIndex = 0;
  var results = [], i = fromIndex;
  while (i < text.length) {
    var start = text.indexOf('[BRANCH:', i);
    if (start === -1) break;
    var jsonStart = start + 8;
    if (jsonStart >= text.length || text[jsonStart] !== '{') { i = jsonStart; continue; }
    var depth = 0, j = jsonStart, closed = -1;
    while (j < text.length) {
      if (text[j] === '{') depth++;
      else if (text[j] === '}') {
        depth--;
        if (depth === 0) { if (j + 1 < text.length && text[j + 1] === ']') closed = j + 1; break; }
      }
      j++;
    }
    if (closed === -1) break;
    results.push({ jsonStr: text.slice(jsonStart, j + 1), start: start, end: closed + 1 });
    i = closed + 1;
  }
  return results;
}

function buildDisplayText(fullText) {
  var markers = extractBranchMarkers(fullText);
  var result = '', last = 0;
  for (var i = 0; i < markers.length; i++) { result += fullText.slice(last, markers[i].start); last = markers[i].end; }
  result += fullText.slice(last);
  var tailIdx = result.lastIndexOf('[BRANCH:');
  if (tailIdx !== -1 && result.slice(tailIdx).indexOf('}]') === -1) {
    result = result.slice(0, tailIdx).trimEnd();
  }
  return result.trim();
}

/* ─── Stream from Anthropic ─────────────────────────────────────────────── */
async function streamClaude(apiKey, systemPrompt, userMessage, onChunk) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      stream: true,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') return;
      try {
        const ev = JSON.parse(data);
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') onChunk(ev.delta.text);
      } catch (_) {}
    }
  }
}

/* ─── BranchTree visual ─────────────────────────────────────────────────── */
const ROOT_W = 186, ROOT_H = 66, ROOT_Y = 20;
const NODE_W = 168, BRANCH_Y = 200;

function BranchTree({ branches, mergedBranch }) {
  const containerRef = useRef(null);
  const [w, setW] = useState(700);

  useEffect(() => {
    const update = () => { if (containerRef.current) setW(containerRef.current.offsetWidth); };
    update();
    const ro = new ResizeObserver(update);
    if (containerRef.current) ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const rootCX = w / 2;
  const rootX = rootCX - ROOT_W / 2;
  const rootBY = ROOT_Y + ROOT_H;

  const bpos = branches.map((_, i) => {
    const n = Math.max(branches.length, 1);
    const cx = (w / (n + 1)) * (i + 1);
    return { x: cx - NODE_W / 2, cx };
  });

  return (
    <div ref={containerRef} style={{ position: 'relative', minHeight: BRANCH_Y + 130 }}>
      {/* SVG lines */}
      <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', overflow: 'visible' }}>
        {bpos.map((pos, i) => {
          const b = branches[i];
          const col = b.status === 'failed' ? '#FF5C5C' : b.status === 'merged' ? '#00C9A7' : '#2d4a6a';
          return (
            <line key={i}
              x1={rootCX} y1={rootBY} x2={pos.cx} y2={BRANCH_Y}
              stroke={col} strokeWidth={b.status === 'merged' ? 2 : 1.5}
              strokeDasharray={b.status === 'exploring' ? '5,3' : 'none'}
              opacity={b.status === 'failed' ? 0.4 : 0.9}
              style={{ transition: 'stroke 0.5s, opacity 0.5s' }}
            />
          );
        })}
        {mergedBranch && (() => {
          const idx = branches.findIndex(b => b.name === mergedBranch);
          if (idx < 0) return null;
          const pos = bpos[idx];
          return (
            <path
              d={`M ${pos.cx} ${BRANCH_Y} C ${pos.cx} ${BRANCH_Y-50} ${rootCX} ${rootBY+50} ${rootCX} ${rootBY}`}
              stroke="#00C9A7" strokeWidth="2.5" fill="none"
              strokeDasharray="8,4"
              style={{ animation: 'dashFlow 0.55s linear infinite' }}
            />
          );
        })()}
      </svg>

      {/* Root node */}
      <div style={{
        position: 'absolute', left: rootX, top: ROOT_Y,
        width: ROOT_W, height: ROOT_H,
        background: 'linear-gradient(135deg,#0d2416,#0f2a1c)',
        border: '2px solid #00C9A7', borderRadius: 10,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        animation: 'pulseGlow 2s ease-in-out infinite', gap: 4,
      }}>
        <div style={{ fontSize: '0.58rem', fontWeight: 700, color: '#00C9A7', letterSpacing: '0.13em', textTransform: 'uppercase' }}>Production DB</div>
        <div style={{ fontSize: '0.76rem', fontWeight: 600, color: '#e2e8f0' }}>main branch</div>
        {mergedBranch && <div style={{ fontSize: '0.58rem', color: '#00C9A7' }}>✓ merge complete</div>}
      </div>

      {/* Branch nodes */}
      {branches.map((b, i) => {
        const pos = bpos[i];
        const failed = b.status === 'failed', merged = b.status === 'merged';
        const borderCol = failed ? '#FF5C5C' : merged ? '#00C9A7' : '#2d4a6a';
        const bg = failed ? 'rgba(255,92,92,0.07)' : merged ? 'rgba(0,201,167,0.07)' : '#162032';
        return (
          <div key={b.name} style={{
            position: 'absolute', left: pos.x, top: BRANCH_Y, width: NODE_W,
            background: bg, border: `1.5px solid ${borderCol}`,
            borderRadius: 8, padding: '9px 11px',
            transition: 'all 0.45s ease',
            animation: 'fadeInUp 0.35s ease forwards',
            boxShadow: merged ? '0 0 16px rgba(0,201,167,0.14)' : 'none',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 5 }}>
              <span style={{ fontSize: '0.8rem' }}>{failed ? '✗' : merged ? '✓' : '◉'}</span>
              <span style={{
                fontSize: '0.7rem', fontWeight: 700, flex: 1,
                color: failed ? '#FF5C5C' : merged ? '#00C9A7' : '#e2e8f0',
                textDecoration: failed ? 'line-through' : 'none',
              }}>{b.name}</span>
              <span style={{
                fontSize: '0.56rem', fontWeight: 700, padding: '1px 5px', borderRadius: 3,
                textTransform: 'uppercase', letterSpacing: '0.05em',
                background: failed ? 'rgba(255,92,92,0.15)' : merged ? 'rgba(0,201,167,0.15)' : 'rgba(45,74,106,0.5)',
                color: failed ? '#FF5C5C' : merged ? '#00C9A7' : '#94a3b8',
              }}>{b.status}</span>
            </div>
            <div style={{ fontSize: '0.67rem', color: '#94a3b8', lineHeight: 1.45 }}>{b.description}</div>
            {failed && b.reason && (
              <div style={{ fontSize: '0.62rem', color: '#FF5C5C', marginTop: 5, lineHeight: 1.35, borderTop: '1px solid rgba(255,92,92,0.18)', paddingTop: 4 }}>
                ✗ {b.reason}
              </div>
            )}
            {merged && (
              <div style={{ fontSize: '0.62rem', color: '#00C9A7', marginTop: 5, lineHeight: 1.35, borderTop: '1px solid rgba(0,201,167,0.18)', paddingTop: 4 }}>
                ✓ merged to production
              </div>
            )}
            {b.status === 'exploring' && (
              <div style={{ marginTop: 5, display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 6, height: 6, borderRadius: '50%', background: '#00C9A7', animation: 'pulseGlow 1.2s ease-in-out infinite' }} />
                <span style={{ fontSize: '0.59rem', color: '#00C9A7' }}>exploring...</span>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────────────────────── */
function App() {
  const [apiKey] = useState(window.__APIKEY__ || '');
  const [taskInput, setTaskInput] = useState(
    "Migrate user_events table to new schema: add 'session_id' column, backfill from logs"
  );
  const [userTask, setUserTask] = useState('');
  const [agentText, setAgentText] = useState('');
  const [branches, setBranches] = useState([]);
  const [mergedBranch, setMergedBranch] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const msgEndRef = useRef(null);

  useEffect(() => { msgEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [agentText]);

  const applyEvent = useCallback((ev) => {
    if (ev.action === 'create') {
      setBranches(prev => {
        if (prev.find(b => b.name === ev.name)) return prev;
        return [...prev, { name: ev.name, description: ev.description || '', status: 'exploring' }];
      });
    } else if (ev.action === 'fail') {
      setBranches(prev => prev.map(b =>
        b.name === ev.name ? { ...b, status: 'failed', reason: ev.reason || 'Approach failed' } : b
      ));
    } else if (ev.action === 'merge') {
      setBranches(prev => prev.map(b =>
        b.name === ev.name ? { ...b, status: 'merged' } : b
      ));
      setMergedBranch(ev.name);
    }
  }, []);

  const sendTask = useCallback(async () => {
    if (!taskInput.trim() || !apiKey.trim() || loading) return;
    setLoading(true);
    setAgentText('');
    setBranches([]);
    setMergedBranch(null);
    setError('');
    setUserTask(taskInput.trim());

    let full = '', processedIdx = 0;
    try {
      await streamClaude(apiKey, SYSTEM_PROMPT, taskInput.trim(), (chunk) => {
        full += chunk;
        const markers = extractBranchMarkers(full, processedIdx);
        for (const m of markers) {
          try { applyEvent(JSON.parse(m.jsonStr)); } catch (_) {}
          processedIdx = m.end;
        }
        setAgentText(buildDisplayText(full));
      });
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [taskInput, apiKey, loading, applyEvent]);

  const handleKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTask(); } };
  const canSend = apiKey.length > 20 && taskInput.trim() && !loading;
  const stats = {
    exploring: branches.filter(b => b.status === 'exploring').length,
    failed: branches.filter(b => b.status === 'failed').length,
    merged: branches.filter(b => b.status === 'merged').length,
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      {/* Header */}
      <div className="header">
        <div className="header-left">
          <span className="badge">Demo 03</span>
          <span className="title"><span>Branch</span> Explorer</span>
          <span className="subtitle">TiDB Serverless · Agentic Branching</span>
        </div>
        <a className="back-link" href="../">← Back to All Demos</a>
      </div>


      {/* Main */}
      <div className="main">
        {/* Left */}
        <div className="chat-panel">
          <div className="panel-header">
            <span>Agent Reasoning</span>
            {loading && (
              <span style={{ fontSize: '0.62rem', color: 'var(--teal)', display: 'flex', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 10, height: 10, border: '1.5px solid #1e2d40', borderTopColor: 'var(--teal)', borderRadius: '50%', animation: 'spin 0.65s linear infinite' }} />
                streaming
              </span>
            )}
          </div>
          <div className="messages">
            {!userTask && !agentText && (
              <div style={{ color: 'var(--muted)', fontSize: '0.78rem', textAlign: 'center', marginTop: '2.5rem' }}>
                <div style={{ fontSize: '1.6rem', marginBottom: '0.5rem' }}>🌿</div>
                <div style={{ fontWeight: 600, marginBottom: '0.3rem' }}>Enter a migration task</div>
                <div style={{ fontSize: '0.7rem', maxWidth: '240px', margin: '0 auto', lineHeight: 1.6 }}>
                  Watch the agent spawn database branches in real time as it reasons through approaches.
                </div>
              </div>
            )}
            {userTask && <div className="user-msg">{userTask}</div>}
            {agentText && (
              <div className="agent-msg">
                {agentText}
                {loading && <span style={{ animation: 'blink 1s step-end infinite', color: 'var(--teal)' }}>▋</span>}
              </div>
            )}
            {loading && !agentText && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--muted)', fontSize: '0.78rem' }}>
                <div style={{ width: 13, height: 13, border: '1.5px solid #1e2d40', borderTopColor: 'var(--teal)', borderRadius: '50%', animation: 'spin 0.65s linear infinite' }} />
                Agent is thinking...
              </div>
            )}
            {error && (
              <div style={{ background: 'var(--red-dim)', border: '1px solid rgba(255,92,92,0.3)', borderRadius: 7, padding: '0.55rem 0.75rem', fontSize: '0.76rem', color: 'var(--red)' }}>
                ⚠ {error}
              </div>
            )}
            <div ref={msgEndRef} />
          </div>
          <div className="input-area">
            <textarea
              rows={2}
              value={taskInput}
              onChange={e => setTaskInput(e.target.value)}
              onKeyDown={handleKey}
              placeholder="Describe a data migration task..."
              disabled={loading}
            />
            <button className="run-btn" onClick={sendTask} disabled={!canSend}>
              {loading ? '···' : 'Run →'}
            </button>
          </div>
        </div>

        {/* Right */}
        <div className="tree-panel">
          <div className="panel-header">
            <span>Database Branch Topology</span>
            {branches.length > 0 && (
              <span style={{ display: 'flex', gap: 10 }}>
                {stats.exploring > 0 && <span style={{ color: '#94a3b8', fontSize: '0.62rem' }}>{stats.exploring} exploring</span>}
                {stats.failed > 0 && <span style={{ color: 'var(--red)', fontSize: '0.62rem' }}>{stats.failed} failed</span>}
                {stats.merged > 0 && <span style={{ color: 'var(--teal)', fontSize: '0.62rem' }}>{stats.merged} merged</span>}
              </span>
            )}
          </div>
          <div className="tree-canvas">
            {branches.length === 0 && !loading && (
              <div style={{ color: 'var(--muted)', fontSize: '0.76rem', textAlign: 'center', paddingTop: '3.5rem' }}>
                <div style={{ fontSize: '1.8rem', marginBottom: '0.6rem', opacity: 0.3 }}>🌲</div>
                <div style={{ fontWeight: 600 }}>Branch topology will appear here</div>
                <div style={{ fontSize: '0.68rem', marginTop: '0.35rem', opacity: 0.7 }}>
                  Nodes spawn as the agent explores each approach
                </div>
              </div>
            )}
            {(branches.length > 0 || loading) && (
              <BranchTree branches={branches} mergedBranch={mergedBranch} />
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
