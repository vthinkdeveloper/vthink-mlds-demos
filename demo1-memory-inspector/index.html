<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Inspector: MLDS 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0D1B2A;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes bucketFlash {
      0%   { background-color: transparent; }
      20%  { background-color: rgba(0, 201, 167, 0.18); }
      100% { background-color: transparent; }
    }
    .bucket-flash { animation: bucketFlash 0.55s ease-out; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

    textarea:focus { outline: none; border-color: #00C9A7 !important; }

    .send-btn:hover:not(:disabled) { background: #00e5be !important; }
    .new-session-btn:hover { border-color: #00C9A7 !important; color: #00C9A7 !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-v="5">
    const { useState, useRef, useEffect, useCallback } = React;

    /* ── Memory bucket metadata ── */
    const BUCKETS = [
      { key: 'stm',        label: 'STM',           subtitle: 'Current Session',   color: '#FFBE0B' },
      { key: 'episodic',   label: 'Episodic LTM',  subtitle: 'Key Past Events',     color: '#3B82F6' },
      { key: 'semantic',   label: 'Semantic LTM',  subtitle: 'Facts & Patterns',    color: '#10B981' },
      { key: 'procedural', label: 'Procedural LTM',subtitle: 'Learned Skills',      color: '#8B5CF6' },
    ];

    const EMPTY_MEM = { stm: [], episodic: [], semantic: [], procedural: [] };

    /* All API calls go through the local proxy: key never touches the browser */
    const API_ENDPOINT = '/api/chat';

    /* ── Pre-built prompts for live demo ── */
    const DEMO_PROMPTS = [
      { label: '1. Intro',      text: "Hey, I'm Adharsh — I'm a lead software engineer at vThink. Quick heads up on how I like to work: keep things short and to the point." },
      { label: '2. Retro Event',text: "Last week I ran a sprint retrospective with my engineering team. We surfaced three blockers: slow CI pipeline, unclear product requirements, and too many context-switching meetings." },
      { label: '3. Retro Rules',text: "I always run retros the same way: Start / Stop / Continue format, team votes on the top 3 items, each item gets a named owner and a hard deadline. I never leave a retro without written action items." },
      { label: '4. Email',      text: "Based on what we discussed, draft a short follow-up email I can send to my team today." },
      { label: '5. Recall',     text: "What do you know about me and how I run my team?" },
    ];

    /* ── MemoryBucket (accordion) ── */
    function MemoryBucket({ label, subtitle, color, items, flashKey, open, onToggle, grouped }) {
      return (
        <div
          style={{
            background: '#162032',
            borderRadius: 10,
            overflow: 'hidden',
            border: `1px solid ${open ? color + '88' : '#1a2e47'}`,
            transition: 'border-color 0.2s',
            flexShrink: 0,
          }}
        >
          {/* Header (click to toggle) */}
          <div
            onClick={onToggle}
            style={{
              padding: '8px 12px',
              background: color + '18',
              borderLeft: `3px solid ${color}`,
              display: 'flex',
              alignItems: 'center',
              gap: 6,
              cursor: 'pointer',
              userSelect: 'none',
            }}
          >
            <span style={{
              fontSize: '0.7rem',
              color,
              width: 10,
              display: 'inline-block',
              transition: 'transform 0.2s',
              transform: open ? 'rotate(90deg)' : 'rotate(0deg)',
            }}>▶</span>
            <span style={{ fontWeight: 700, fontSize: '0.8rem', color, letterSpacing: '0.04em' }}>
              {label}
            </span>
            <span style={{ fontSize: '0.7rem', color: color + 'aa' }}>{subtitle}</span>
            <span style={{
              marginLeft: 'auto',
              fontSize: '0.68rem',
              background: color + '28',
              color,
              borderRadius: 4,
              padding: '1px 6px',
              fontWeight: 600,
            }}>
              {items.length}
            </span>
          </div>

          {/* Content (only when open) */}
          {open && (
            <div style={{ maxHeight: 260, overflowY: 'auto', padding: '10px 12px' }}>
              <div key={flashKey} className={flashKey > 0 ? 'bucket-flash' : ''}>
                {items.length === 0 ? (
                  <p style={{ color: '#334155', fontSize: '0.78rem', fontStyle: 'italic' }}>
                    No entries yet…
                  </p>
                ) : (
                  <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {(() => {
                      /* Group procedural items by key (e.g. "Retro: ...") */
                      const hasKeys = grouped && items.every(x => x.includes(': '));
                      if (!hasKeys) {
                        return items.map((item, i) => (
                          <li key={i} style={{
                            fontSize: '0.8rem', color: '#cbd5e1', lineHeight: 1.65,
                            paddingLeft: 10, borderLeft: `2px solid ${color}55`,
                          }}>{item}</li>
                        ));
                      }
                      const groups = {};
                      items.forEach(item => {
                        const idx = item.indexOf(': ');
                        const key = item.slice(0, idx);
                        const val = item.slice(idx + 2);
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(val);
                      });
                      return Object.entries(groups).map(([key, vals]) => (
                        <li key={key} style={{
                          fontSize: '0.8rem', color: '#cbd5e1', lineHeight: 1.65,
                          paddingLeft: 10, borderLeft: `2px solid ${color}55`,
                        }}>
                          <span style={{ color, fontWeight: 600 }}>{key}:</span>
                          <ul style={{ listStyle: 'none', paddingLeft: 10, marginTop: 3, display: 'flex', flexDirection: 'column', gap: 3 }}>
                            {vals.map((v, j) => (
                              <li key={j} style={{ fontSize: '0.78rem', color: '#94a3b8' }}>• {v}</li>
                            ))}
                          </ul>
                        </li>
                      ));
                    })()}
                  </ul>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── ChatBubble ── */
    function ChatBubble({ role, content }) {
      const isUser = role === 'user';
      return (
        <div style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
          <div style={{
            maxWidth: '76%',
            background: isUser ? '#00C9A7' : '#162032',
            color: isUser ? '#0D1B2A' : '#e2e8f0',
            borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
            padding: '9px 14px',
            fontSize: '0.875rem',
            lineHeight: 1.6,
            wordBreak: 'break-word',
            boxShadow: '0 1px 4px rgba(0,0,0,0.3)',
          }}>
            {content}
          </div>
        </div>
      );
    }

    /* ── Memory toggle pill ── */
    function MemToggle({ label, enabled, onToggle, color }) {
      return (
        <button
          onClick={onToggle}
          title={enabled ? `${label} enabled — click to disable` : `${label} disabled — click to enable`}
          style={{
            display: 'flex', alignItems: 'center', gap: 6,
            background: enabled ? color + '18' : 'transparent',
            border: `1px solid ${enabled ? color + '66' : '#1a2e47'}`,
            borderRadius: 6,
            color: enabled ? color : '#475569',
            padding: '4px 9px',
            cursor: 'pointer',
            fontSize: '0.7rem',
            fontFamily: 'inherit',
            fontWeight: 700,
            letterSpacing: '0.05em',
            transition: 'all 0.15s',
          }}
        >
          <span style={{
            width: 7, height: 7, borderRadius: '50%',
            background: enabled ? color : '#334155',
          }} />
          {label}
          <span style={{ fontSize: '0.62rem', opacity: 0.7 }}>
            {enabled ? 'ON' : 'OFF'}
          </span>
        </button>
      );
    }

    /* ── Main App ── */
    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput]       = useState('');
      const [loading, setLoading]   = useState(false);
      const [memory, setMemory]     = useState({ ...EMPTY_MEM });
      const [flashKeys, setFlashKeys] = useState({ stm: 0, episodic: 0, semantic: 0, procedural: 0 });
      const [openBuckets, setOpenBuckets] = useState({});
      const toggleBucket = (key) => setOpenBuckets(prev => ({ ...prev, [key]: !prev[key] }));
      const [stmEnabled, setStmEnabled] = useState(false);
      const [ltmEnabled, setLtmEnabled] = useState(false);
      const memoryRef = useRef({ ...EMPTY_MEM });
      const stmRef = useRef(false);
      const ltmRef = useRef(false);

      useEffect(() => { stmRef.current = stmEnabled; }, [stmEnabled]);
      useEffect(() => { ltmRef.current = ltmEnabled; }, [ltmEnabled]);

      /* keep ref in sync so sendMessage always reads latest LTM */
      useEffect(() => { memoryRef.current = memory; }, [memory]);

      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      /* ── Shared fetch helper ── */
      const callAPI = useCallback(async (payload) => {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data;
      }, []);

      /* ── Debug log: POST to /api/log endpoint ── */
      const debugLog = useCallback(async (tag, data) => {
        try {
          await fetch('/api/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tag, data, ts: new Date().toISOString() }),
          });
        } catch (_) {}
      }, []);

      /* ── Memory extraction (haiku, fast) ── */
      const extractMemory = useCallback(async (msgs) => {
        debugLog('EXTRACT_START', { msgCount: msgs.length });
        try {
          const existing = memoryRef.current;
          const existingJson = JSON.stringify({ episodic: existing.episodic, semantic: existing.semantic, procedural: existing.procedural });

          const data = await callAPI({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1024,
            system: `You manage a memory system. Given existing memory and a new exchange, return the UPDATED FULL memory state as valid JSON only (no markdown, no explanation).

EXISTING MEMORY:
${existingJson}

RULES:
- Merge new information into the existing memory. Do NOT duplicate — if a fact already exists, keep it as-is. If new info refines or contradicts an existing entry, REPLACE the old entry.
- Keep each bucket tight: max 5 entries per bucket. Consolidate related facts into one entry.

BUCKETS:
stm: What the user just said/asked in this exchange only. 1-3 short strings.

episodic: Specific events the user described (things that happened, with time context). One entry per distinct event. Examples: "Ran a sprint retrospective with the engineering team last week"

semantic: Distinct facts about the user — identity, role, preferences. Each entry is ONE unique fact. NO overlapping entries. Examples: "Name: Adharsh", "Role: lead software engineer at vThink", "Prefers concise bullet-pointed answers"

procedural: Repeatable workflows or skills. Each entry MUST start with a category label + colon, then the step. Examples: "Retro: use Start / Stop / Continue format", "Email: send written summary same day", "Communication: use bullet points, not paragraphs"

Return ONLY the JSON object with keys: stm, episodic, semantic, procedural. Every value is an array of plain strings.`,
            messages: msgs,
          });
          debugLog('EXTRACT_API_RESP', { content: data.content?.[0]?.text?.slice(0, 500) });
          const raw       = data.content?.[0]?.text ?? '{}';
          const jsonMatch = raw.match(/\{[\s\S]*\}/);
          debugLog('EXTRACT_JSON_MATCH', { matched: !!jsonMatch, raw: raw.slice(0, 300) });
          const parsed    = JSON.parse(jsonMatch ? jsonMatch[0] : '{}');
          debugLog('EXTRACT_PARSED', parsed);
          /* Normalise: stringify any items that came back as objects */
          const toStrings = arr => (Array.isArray(arr) ? arr : [])
            .map(x => typeof x === 'string' ? x : JSON.stringify(x));
          setMemory(prev => {
            const newMem = {
              stm:        toStrings(parsed.stm),
              episodic:   parsed.episodic?.length   ? toStrings(parsed.episodic)   : prev.episodic,
              semantic:   parsed.semantic?.length    ? toStrings(parsed.semantic)   : prev.semantic,
              procedural: parsed.procedural?.length  ? toStrings(parsed.procedural) : prev.procedural,
            };
            const changed = {};
            for (const k of ['stm', 'episodic', 'semantic', 'procedural']) {
              if (JSON.stringify(newMem[k]) !== JSON.stringify(prev[k])) changed[k] = true;
            }
            debugLog('EXTRACT_RESULT', { newMem, changed });
            if (Object.keys(changed).length > 0) {
              setFlashKeys(fk => {
                const next = { ...fk };
                for (const k of Object.keys(changed)) next[k] = (next[k] || 0) + 1;
                return next;
              });
            }
            return newMem;
          });
        } catch (err) {
          debugLog('EXTRACT_ERROR', { message: err.message, stack: err.stack });
        }
      }, [callAPI]);

      /* ── Build system prompt from current LTM ── */
      const buildSystemPrompt = (mem, ltmOn) => {
        if (!ltmOn) {
          return `You are a helpful assistant meeting the user for the first time in this conversation. If the user asks who they are, what you know about them, or anything about their role, work, preferences, or history, and they have not already told you in this conversation, simply say you don't know — naturally, like a person would. Do NOT use words like "memory", "remember", "recall", "stateless", "session", "context", or reference how you work internally. Do not apologise or offer explanations about your limitations. Just answer naturally. Be concise.`;
        }
        const fmt = (arr) => arr.length ? arr.map(x => `• ${x}`).join('\n') : '  (none yet)';
        return `You are a helpful assistant who knows the following about the user. Treat these as things you simply know — do not mention memory, recall, or where this information came from.

What happened recently:
${fmt(mem.episodic)}

Facts about the user:
${fmt(mem.semantic)}

How the user works:
${fmt(mem.procedural)}

Use this to personalise every response. When asked about the user or their working style, answer directly from what you know — never say "based on what I remember" or reference storage/memory. Be concise and use bullet points.`;
      };

      /* ── Send chat message ── */
      const sendMessage = useCallback(async () => {
        const trimmed = input.trim();
        if (!trimmed || loading) return;

        const userMsg  = { role: 'user', content: trimmed };
        const outgoing = [...messages, userMsg];
        setMessages(outgoing);
        setInput('');
        setLoading(true);

        try {
          const apiMessages = stmRef.current ? outgoing : [userMsg];
          const data = await callAPI({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1024,
            system: buildSystemPrompt(memoryRef.current, ltmRef.current),
            messages: apiMessages,
          });
          const assistantText = data.content?.[0]?.text ?? '(empty response)';
          const full = [...outgoing, { role: 'assistant', content: assistantText }];
          setMessages(full);
          extractMemory(full.slice(-2));
        } catch (err) {
          setMessages(prev => [...prev, { role: 'assistant', content: `⚠ Error: ${err.message}` }]);
        } finally {
          setLoading(false);
        }
      }, [input, loading, messages, callAPI, extractMemory]);

      /* ── New Session: clears chat + STM only ── */
      const newSession = useCallback(() => {
        setMessages([]);
        setMemory(prev => ({ ...prev, stm: [] }));
        setFlashKeys(fk => ({ ...fk, stm: (fk.stm || 0) + 1 }));
      }, []);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      };

      const canSend = !!input.trim() && !loading;

      /* ── Render ── */
      return (
        <div style={{ display: 'flex', height: '100vh' }}>

          {/* ════════════════ LEFT: Chat ════════════════ */}
          <div style={{
            flex: 1,
            display: 'flex',
            flexDirection: 'column',
            borderRight: '1px solid #1a2e47',
            minWidth: 0,
          }}>

            {/* Top bar */}
            <div style={{
              padding: '10px 16px',
              borderBottom: '1px solid #1a2e47',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              background: '#0f1e2e',
              flexShrink: 0,
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{
                  fontSize: '0.62rem',
                  fontWeight: 700,
                  letterSpacing: '0.15em',
                  color: '#00C9A7',
                  background: 'rgba(0,201,167,0.12)',
                  padding: '3px 8px',
                  borderRadius: 4,
                  textTransform: 'uppercase',
                }}>Demo 01</span>
                <span style={{
                  fontWeight: 700,
                  fontSize: '0.9rem',
                  color: '#e2e8f0',
                  letterSpacing: '0.02em',
                }}>
                  Memory Inspector
                </span>
                <span style={{
                  fontSize: '0.7rem',
                  color: '#475569',
                }}>
                  Cognitive Architectures · MLDS 2026
                </span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <MemToggle label="STM" enabled={stmEnabled} onToggle={() => setStmEnabled(v => !v)} color="#FFBE0B" />
                <MemToggle label="LTM" enabled={ltmEnabled} onToggle={() => setLtmEnabled(v => !v)} color="#10B981" />
                <button
                  className="new-session-btn"
                  onClick={newSession}
                  style={{
                    background: 'transparent',
                    border: '1px solid #1a2e47',
                    borderRadius: 6,
                    color: '#64748b',
                    padding: '5px 12px',
                    cursor: 'pointer',
                    fontSize: '0.75rem',
                    fontFamily: 'inherit',
                    fontWeight: 600,
                    transition: 'border-color 0.15s, color 0.15s',
                  }}
                >
                  New Session
                </button>
              </div>
            </div>

            {/* Messages */}
            <div style={{
              flex: 1,
              overflowY: 'auto',
              padding: '16px 14px',
              display: 'flex',
              flexDirection: 'column',
              gap: 10,
            }}>
              {messages.length === 0 && (
                <div style={{
                  margin: 'auto',
                  textAlign: 'center',
                  color: '#2d4a66',
                  fontSize: '0.85rem',
                  lineHeight: 1.8,
                  userSelect: 'none',
                  maxWidth: 320,
                }}>
                  <div style={{
                    fontSize: '0.7rem',
                    letterSpacing: '0.2em',
                    color: '#00C9A7',
                    fontWeight: 700,
                    marginBottom: 10,
                  }}>MEMORY INSPECTOR</div>
                  Start chatting — watch the memory buckets populate and flash in real time.
                </div>
              )}
              {messages.map((msg, i) => (
                <ChatBubble key={i} role={msg.role} content={msg.content} />
              ))}
              {loading && (
                <div style={{ display: 'flex', justifyContent: 'flex-start' }}>
                  <div style={{
                    background: '#162032',
                    borderRadius: '16px 16px 16px 4px',
                    padding: '9px 16px',
                    color: '#475569',
                    fontSize: '1rem',
                    letterSpacing: '0.15em',
                  }}>
                    ···
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Prompt chips — quick-fire demo prompts */}
            <div style={{
              padding: '8px 14px',
              borderTop: '1px solid #1a2e47',
              display: 'flex',
              gap: 6,
              overflowX: 'auto',
              background: '#0b1624',
              flexShrink: 0,
            }}>
              {DEMO_PROMPTS.map((p, i) => (
                <button
                  key={i}
                  onClick={() => setInput(p.text)}
                  title={p.text}
                  style={{
                    background: 'transparent',
                    border: '1px solid #1a2e47',
                    borderRadius: 14,
                    color: '#94a3b8',
                    padding: '4px 10px',
                    cursor: 'pointer',
                    fontSize: '0.72rem',
                    fontFamily: 'inherit',
                    fontWeight: 600,
                    whiteSpace: 'nowrap',
                    flexShrink: 0,
                    transition: 'border-color 0.15s, color 0.15s',
                  }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = '#00C9A7'; e.currentTarget.style.color = '#00C9A7'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = '#1a2e47'; e.currentTarget.style.color = '#94a3b8'; }}
                >
                  {p.label}
                </button>
              ))}
            </div>

            {/* Input */}
            <div style={{
              padding: '10px 14px',
              borderTop: '1px solid #1a2e47',
              display: 'flex',
              gap: 8,
              background: '#0f1e2e',
              flexShrink: 0,
            }}>
              <textarea
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
                rows={2}
                style={{
                  flex: 1,
                  background: '#162032',
                  border: '1px solid #1a2e47',
                  borderRadius: 8,
                  padding: '8px 12px',
                  color: '#e2e8f0',
                  fontSize: '0.875rem',
                  resize: 'none',
                  fontFamily: 'inherit',
                  lineHeight: 1.5,
                  transition: 'border-color 0.15s',
                }}
              />
              <button
                className="send-btn"
                onClick={sendMessage}
                disabled={!canSend}
                style={{
                  background: canSend ? '#00C9A7' : '#162032',
                  border: 'none',
                  borderRadius: 8,
                  color: canSend ? '#0D1B2A' : '#2d4a66',
                  padding: '0 20px',
                  cursor: canSend ? 'pointer' : 'not-allowed',
                  fontWeight: 700,
                  fontSize: '0.875rem',
                  fontFamily: 'inherit',
                  transition: 'background 0.15s, color 0.15s',
                  flexShrink: 0,
                }}
              >
                Send
              </button>
            </div>
          </div>

          {/* ════════════════ RIGHT: Memory Inspector ════════════════ */}
          {(stmEnabled || ltmEnabled) && (
          <div style={{
            flex: 1,
            display: 'flex',
            flexDirection: 'column',
            padding: '12px 14px 14px',
            gap: 10,
            minWidth: 0,
            overflowY: 'auto',
          }}>

            {/* Panel header */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              paddingBottom: 8,
              borderBottom: '1px solid #1a2e47',
              flexShrink: 0,
            }}>
              <span style={{
                fontWeight: 700,
                fontSize: '0.75rem',
                color: '#00C9A7',
                letterSpacing: '0.1em',
                textTransform: 'uppercase',
              }}>
                Memory Buckets
              </span>
              <span style={{ fontSize: '0.68rem', color: '#334155' }}>
                {!stmEnabled ? 'STM disabled · LTM persists'
                  : !ltmEnabled ? 'LTM disabled · STM only'
                  : 'STM resets on New Session · LTM persists'}
              </span>
            </div>

            {/* Buckets: filtered by toggle state; click header to expand/collapse */}
            {BUCKETS
              .filter(b => b.key === 'stm' ? stmEnabled : ltmEnabled)
              .map(({ key, label, subtitle, color }) => (
                <MemoryBucket
                  key={key}
                  label={label}
                  subtitle={subtitle}
                  color={color}
                  items={memory[key]}
                  flashKey={flashKeys[key]}
                  open={!!openBuckets[key]}
                  onToggle={() => toggleBucket(key)}
                  grouped={key === 'procedural'}
                />
              ))
            }
          </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
