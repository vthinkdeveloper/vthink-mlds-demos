<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Inspector: MLDS 2026</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0D1B2A;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes bucketFlash {
      0%   { background-color: transparent; }
      20%  { background-color: rgba(0, 201, 167, 0.18); }
      100% { background-color: transparent; }
    }
    .bucket-flash { animation: bucketFlash 0.55s ease-out; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

    textarea:focus { outline: none; border-color: #00C9A7 !important; }

    .send-btn:hover:not(:disabled) { background: #00e5be !important; }
    .new-session-btn:hover { border-color: #00C9A7 !important; color: #00C9A7 !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-v="4">
    const { useState, useRef, useEffect, useCallback } = React;

    /* ── Memory bucket metadata ── */
    const BUCKETS = [
      { key: 'stm',        label: 'STM',           subtitle: 'Current Session',   color: '#FFBE0B' },
      { key: 'episodic',   label: 'Episodic LTM',  subtitle: 'What Happened',     color: '#3B82F6' },
      { key: 'semantic',   label: 'Semantic LTM',  subtitle: 'Facts Learned',     color: '#10B981' },
      { key: 'procedural', label: 'Procedural LTM',subtitle: 'Patterns Observed', color: '#8B5CF6' },
    ];

    const EMPTY_MEM = { stm: [], episodic: [], semantic: [], procedural: [] };

    /* ── Pre-seeded long-term memory (persists across sessions) ── */
    const SEEDED_LTM = {
      episodic: [
        'Ran a sprint retrospective with the engineering team last week',
        'Team surfaced three blockers: slow CI pipeline, unclear product requirements, and too many context-switching meetings',
        'Each blocker was assigned a named owner with a hard deadline before the retro closed',
      ],
      semantic: [
        'Name: Adharsh',
        'Strongly prefers concise, bullet-pointed answers: never long paragraphs',
        'Values accountability: every meeting must end with written action items, named owners, and deadlines',
      ],
      procedural: [
        'Retro format: always Start / Stop / Continue, team votes on top 3 items only',
        'Each action item must have one named owner and one hard deadline before the retro ends',
        'Retro closes with a written summary emailed to the full team the same day',
      ],
    };

    /* All API calls go through the local proxy: key never touches the browser */
    const API_ENDPOINT = '/api/messages';

    /* ── MemoryBucket ── */
    function MemoryBucket({ label, subtitle, color, items, flashKey, expanded, onExpand, onCollapse }) {
      const fontSize = expanded ? '1rem' : '0.8rem';
      const gap      = expanded ? 12 : 5;

      return (
        <div
          onClick={expanded ? undefined : onExpand}
          style={{
            background: '#162032',
            borderRadius: 10,
            overflow: 'hidden',
            flex: expanded ? 1 : 1,
            display: 'flex',
            flexDirection: 'column',
            minHeight: 0,
            border: `1px solid ${expanded ? color + '88' : '#1a2e47'}`,
            cursor: expanded ? 'default' : 'pointer',
            transition: 'border-color 0.2s',
          }}
        >
          {/* Header */}
          <div style={{
            padding: expanded ? '10px 16px' : '7px 12px',
            background: color + '18',
            borderLeft: `3px solid ${color}`,
            display: 'flex',
            alignItems: 'center',
            gap: 6,
            flexShrink: 0,
          }}>
            <span style={{ fontWeight: 700, fontSize: expanded ? '0.95rem' : '0.78rem', color, letterSpacing: '0.04em' }}>
              {label}
            </span>
            <span style={{ fontSize: expanded ? '0.8rem' : '0.7rem', color: color + 'aa' }}>{subtitle}</span>
            <span style={{
              marginLeft: 'auto',
              fontSize: '0.68rem',
              background: color + '28',
              color,
              borderRadius: 4,
              padding: '1px 6px',
              fontWeight: 600,
            }}>
              {items.length}
            </span>
            {expanded && (
              <button
                onClick={onCollapse}
                style={{
                  marginLeft: 8,
                  background: 'transparent',
                  border: 'none',
                  color: '#64748b',
                  cursor: 'pointer',
                  fontSize: '1rem',
                  lineHeight: 1,
                  padding: '0 2px',
                }}
              >
                ✕
              </button>
            )}
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflowY: 'auto', padding: expanded ? '16px 20px' : '10px 12px' }}>
            <div key={flashKey} className={flashKey > 0 ? 'bucket-flash' : ''}>
              {items.length === 0 ? (
                <p style={{ color: '#334155', fontSize: '0.78rem', fontStyle: 'italic' }}>
                  No entries yet…
                </p>
              ) : (
                <ul style={{ listStyle: 'none', display: 'flex', flexDirection: 'column', gap }}>
                  {items.map((item, i) => (
                    <li key={i} style={{
                      fontSize,
                      color: '#cbd5e1',
                      lineHeight: 1.65,
                      paddingLeft: expanded ? 14 : 10,
                      borderLeft: `2px solid ${color}55`,
                    }}>
                      {item}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ── ChatBubble ── */
    function ChatBubble({ role, content }) {
      const isUser = role === 'user';
      return (
        <div style={{ display: 'flex', justifyContent: isUser ? 'flex-end' : 'flex-start' }}>
          <div style={{
            maxWidth: '76%',
            background: isUser ? '#00C9A7' : '#162032',
            color: isUser ? '#0D1B2A' : '#e2e8f0',
            borderRadius: isUser ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
            padding: '9px 14px',
            fontSize: '0.875rem',
            lineHeight: 1.6,
            wordBreak: 'break-word',
            boxShadow: '0 1px 4px rgba(0,0,0,0.3)',
          }}>
            {content}
          </div>
        </div>
      );
    }

    /* ── Main App ── */
    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput]       = useState('');
      const [loading, setLoading]   = useState(false);
      const [memory, setMemory]     = useState({ stm: [], ...SEEDED_LTM });
      const [flashKeys, setFlashKeys] = useState({ stm: 0, episodic: 0, semantic: 0, procedural: 0 });
      const [expandedBucket, setExpandedBucket] = useState(null);
      const memoryRef = useRef({ stm: [], ...SEEDED_LTM });

      /* keep ref in sync so sendMessage always reads latest LTM */
      useEffect(() => { memoryRef.current = memory; }, [memory]);

      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      /* ── Shared fetch helper ── */
      const callAPI = useCallback(async (payload) => {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data;
      }, []);

      /* ── Memory extraction (haiku, fast) ── */
      const extractMemory = useCallback(async (msgs) => {
        try {
          const data = await callAPI({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1024,
            system: 'Extract memory from this conversation. Return ONLY valid JSON: no markdown, no explanation, no extra text: with exactly these keys: stm (array of plain strings), episodic (array of plain strings), semantic (array of plain strings), procedural (array of plain strings). Every value must be a plain string, not an object.',
            messages: msgs,
          });
          const raw       = data.content?.[0]?.text ?? '{}';
          const jsonMatch = raw.match(/\{[\s\S]*\}/);
          const parsed    = JSON.parse(jsonMatch ? jsonMatch[0] : '{}');
          /* Normalise: stringify any items that came back as objects */
          const toStrings = arr => (Array.isArray(arr) ? arr : [])
            .map(x => typeof x === 'string' ? x : JSON.stringify(x));
          /* Merge new extractions on top of existing memory (LTM accumulates) */
          const merge = (existing, incoming) => {
            const deduped = [...existing];
            for (const item of incoming) {
              if (!deduped.includes(item)) deduped.push(item);
            }
            return deduped;
          };
          setMemory(prev => {
            const newMem = {
              stm:        toStrings(parsed.stm),
              episodic:   merge(prev.episodic,   toStrings(parsed.episodic)),
              semantic:   merge(prev.semantic,   toStrings(parsed.semantic)),
              procedural: merge(prev.procedural, toStrings(parsed.procedural)),
            };
            const changed = {};
            for (const k of ['stm', 'episodic', 'semantic', 'procedural']) {
              if (JSON.stringify(newMem[k]) !== JSON.stringify(prev[k])) changed[k] = true;
            }
            if (Object.keys(changed).length > 0) {
              setFlashKeys(fk => {
                const next = { ...fk };
                for (const k of Object.keys(changed)) next[k] = (next[k] || 0) + 1;
                return next;
              });
            }
            return newMem;
          });
        } catch (err) {
          console.error('[Memory extraction]', err);
        }
      }, [callAPI]);

      /* ── Build system prompt from current LTM ── */
      const buildSystemPrompt = (mem) => {
        const fmt = (arr) => arr.length ? arr.map(x => `• ${x}`).join('\n') : '  (none yet)';
        return `You are a helpful assistant with access to long-term memory about the user.

EPISODIC MEMORY: past events:
${fmt(mem.episodic)}

SEMANTIC MEMORY: facts about the user:
${fmt(mem.semantic)}

PROCEDURAL MEMORY: how the user works:
${fmt(mem.procedural)}

Use this memory to personalise every response. When asked what you know about the user or their working style, draw directly from this memory. Be concise and use bullet points.`;
      };

      /* ── Send chat message ── */
      const sendMessage = useCallback(async () => {
        const trimmed = input.trim();
        if (!trimmed || loading) return;

        const userMsg  = { role: 'user', content: trimmed };
        const outgoing = [...messages, userMsg];
        setMessages(outgoing);
        setInput('');
        setLoading(true);

        try {
          const data = await callAPI({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 1024,
            system: buildSystemPrompt(memoryRef.current),
            messages: outgoing,
          });
          const assistantText = data.content?.[0]?.text ?? '(empty response)';
          const full = [...outgoing, { role: 'assistant', content: assistantText }];
          setMessages(full);
          extractMemory(full);
        } catch (err) {
          setMessages(prev => [...prev, { role: 'assistant', content: `⚠ Error: ${err.message}` }]);
        } finally {
          setLoading(false);
        }
      }, [input, loading, messages, callAPI, extractMemory]);

      /* ── New Session: clears chat + STM only ── */
      const newSession = useCallback(() => {
        setMessages([]);
        setMemory(prev => ({ ...prev, stm: [] }));
        setFlashKeys(fk => ({ ...fk, stm: (fk.stm || 0) + 1 }));
      }, []);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      };

      const canSend = !!input.trim() && !loading;

      /* ── Render ── */
      return (
        <div style={{ display: 'flex', height: '100vh' }}>

          {/* ════════════════ LEFT: Chat ════════════════ */}
          <div style={{
            flex: 1,
            display: 'flex',
            flexDirection: 'column',
            borderRight: '1px solid #1a2e47',
            minWidth: 0,
          }}>

            {/* Top bar */}
            <div style={{
              padding: '10px 16px',
              borderBottom: '1px solid #1a2e47',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              background: '#0f1e2e',
              flexShrink: 0,
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: '1rem' }}>🧠</span>
                <span style={{
                  fontWeight: 700,
                  fontSize: '0.85rem',
                  color: '#e2e8f0',
                  letterSpacing: '0.02em',
                }}>
                  Memory Inspector
                </span>
                <span style={{
                  fontSize: '0.68rem',
                  color: '#334155',
                  fontStyle: 'italic',
                }}>
                 : Cognitive Architectures Demo
                </span>
              </div>
              <button
                className="new-session-btn"
                onClick={newSession}
                style={{
                  background: 'transparent',
                  border: '1px solid #1a2e47',
                  borderRadius: 6,
                  color: '#64748b',
                  padding: '5px 12px',
                  cursor: 'pointer',
                  fontSize: '0.75rem',
                  fontFamily: 'inherit',
                  fontWeight: 600,
                  transition: 'border-color 0.15s, color 0.15s',
                }}
              >
                New Session
              </button>
            </div>

            {/* Messages */}
            <div style={{
              flex: 1,
              overflowY: 'auto',
              padding: '16px 14px',
              display: 'flex',
              flexDirection: 'column',
              gap: 10,
            }}>
              {messages.length === 0 && (
                <div style={{
                  margin: 'auto',
                  textAlign: 'center',
                  color: '#2d4a66',
                  fontSize: '0.85rem',
                  lineHeight: 1.8,
                  userSelect: 'none',
                }}>
                  <div style={{ fontSize: '2.5rem', marginBottom: 12 }}>🧠</div>
                  Start chatting: watch the memory buckets<br />
                  populate and flash in real time.
                </div>
              )}
              {messages.map((msg, i) => (
                <ChatBubble key={i} role={msg.role} content={msg.content} />
              ))}
              {loading && (
                <div style={{ display: 'flex', justifyContent: 'flex-start' }}>
                  <div style={{
                    background: '#162032',
                    borderRadius: '16px 16px 16px 4px',
                    padding: '9px 16px',
                    color: '#475569',
                    fontSize: '1rem',
                    letterSpacing: '0.15em',
                  }}>
                    ···
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Input */}
            <div style={{
              padding: '10px 14px',
              borderTop: '1px solid #1a2e47',
              display: 'flex',
              gap: 8,
              background: '#0f1e2e',
              flexShrink: 0,
            }}>
              <textarea
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
                rows={2}
                style={{
                  flex: 1,
                  background: '#162032',
                  border: '1px solid #1a2e47',
                  borderRadius: 8,
                  padding: '8px 12px',
                  color: '#e2e8f0',
                  fontSize: '0.875rem',
                  resize: 'none',
                  fontFamily: 'inherit',
                  lineHeight: 1.5,
                  transition: 'border-color 0.15s',
                }}
              />
              <button
                className="send-btn"
                onClick={sendMessage}
                disabled={!canSend}
                style={{
                  background: canSend ? '#00C9A7' : '#162032',
                  border: 'none',
                  borderRadius: 8,
                  color: canSend ? '#0D1B2A' : '#2d4a66',
                  padding: '0 20px',
                  cursor: canSend ? 'pointer' : 'not-allowed',
                  fontWeight: 700,
                  fontSize: '0.875rem',
                  fontFamily: 'inherit',
                  transition: 'background 0.15s, color 0.15s',
                  flexShrink: 0,
                }}
              >
                Send
              </button>
            </div>
          </div>

          {/* ════════════════ RIGHT: Memory Inspector ════════════════ */}
          <div style={{
            flex: 1,
            display: 'flex',
            flexDirection: 'column',
            padding: '12px 14px 14px',
            gap: 10,
            minWidth: 0,
            overflow: 'hidden',
          }}>

            {/* Panel header */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              paddingBottom: 8,
              borderBottom: '1px solid #1a2e47',
              flexShrink: 0,
            }}>
              <span style={{
                fontWeight: 700,
                fontSize: '0.75rem',
                color: '#00C9A7',
                letterSpacing: '0.1em',
                textTransform: 'uppercase',
              }}>
                Memory Buckets
              </span>
              <span style={{ fontSize: '0.68rem', color: '#334155' }}>
                STM resets on New Session · LTM persists
              </span>
            </div>

            {/* Buckets: click to expand, X to collapse */}
            {expandedBucket
              ? BUCKETS.filter(b => b.key === expandedBucket).map(({ key, label, subtitle, color }) => (
                  <MemoryBucket
                    key={key}
                    label={label}
                    subtitle={subtitle}
                    color={color}
                    items={memory[key]}
                    flashKey={flashKeys[key]}
                    expanded={true}
                    onCollapse={() => setExpandedBucket(null)}
                  />
                ))
              : BUCKETS.map(({ key, label, subtitle, color }) => (
                  <MemoryBucket
                    key={key}
                    label={label}
                    subtitle={subtitle}
                    color={color}
                    items={memory[key]}
                    flashKey={flashKeys[key]}
                    expanded={false}
                    onExpand={() => setExpandedBucket(key)}
                  />
                ))
            }
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
